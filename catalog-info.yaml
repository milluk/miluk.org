  annotations:
    github.com/project-slug: milluk/miluk.org
    backstage.io/source-location: url:https://github.com/milluk/miluk.org/tree/dictionary-1990-reproducibility-repair/
  links:
    - url: https://github.com/milluk/miluk.org/pull/1
      title: Restoration integration review
    - url: https://github.com/milluk/miluk.org/blob/dictionary-1990-reproducibility-repair/tools/dictionary/PUBLICATION_HOLD.md
      title: Publication hold
spec:
  type: website
  lifecycle: experimental
  owner: user:default/troy
  system: system:default/miluk
  subcomponentOf: component:default/miluk-org
