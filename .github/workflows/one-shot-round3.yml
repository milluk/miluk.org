# One-shot rebuild, round two of the 2026 notebook collation (#18, #15).
# Deleted through the API once its run lands; an Actions token may not modify
# workflow files. Not part of the repository's normal build.
name: one-shot-round3

on:
  workflow_dispatch:
  push:
    branches: [corpus-repair-t039-l76-vocable-gloss]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corpus-repair-t039-l76-vocable-gloss
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skip if the applier has already run
        id: guard
        run: |
          if [ ! -f apply_round3.py ]; then
            echo "applier absent; this rebuild has already landed"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the corrections
        if: steps.guard.outputs.done == 'false'
        run: python3 apply_round3.py

      - name: Regenerate the public corpus
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          T=tools/dictionary
          PYTHONDONTWRITEBYTECODE=1 python3 $T/pipeline/publish_corpus.py \
            --working-corpus $T/archive/restoration-checkpoint/corpus-v2-working.json \
            --classification $T/provenance/source-classification.json \
            --v2-receipt $T/provenance/v2-effective-diff.json \
            --notebook-collation $T/provenance/notebook-collation-corrections.json \
            --public-output dictionary/data/corpus.json \
            --outside-output $T/archive/outside-edition/slip-file-records.json \
            --containers-output $T/archive/outside-edition/working-containers.json

      - name: Pin the new corpus hash
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          SHA=$(python3 -c "import hashlib;print(hashlib.sha256(open('dictionary/data/corpus.json','rb').read()).hexdigest())")
          echo "corpus sha256: $SHA"
          test "$SHA" = "3d7ff81ae29fd3c7cc1d38d0eef5f8c46db81e76a74840831d7f49c2fac7a684"
          python3 - "$SHA" <<'PY'
          import sys
          from pathlib import Path
          p = Path('tools/dictionary/test_site.py')
          t = p.read_text(encoding='utf-8')
          assert t.count('CORPUS_SHA_PLACEHOLDER') == 1, 'placeholder not found exactly once'
          p.write_text(t.replace('CORPUS_SHA_PLACEHOLDER', sys.argv[1]), encoding='utf-8')
          PY

      - name: Regenerate the site
        if: steps.guard.outputs.done == 'false'
        run: python3 tools/dictionary/gen.py

      - name: Remove the applier
        if: steps.guard.outputs.done == 'false'
        run: rm -f apply_round3.py

      - name: Assert the changed-file set is exactly what was expected
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-status | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          D	apply_round3.py
          M	dictionary/data/corpus.json
          M	dictionary/stories/t039-black-bear-and-pack-basket-bear-grizzly.html
          M	dictionary/stories/t055-the-trickster-person-who-made-the-country.html
          M	tools/dictionary/provenance/notebook-collation-corrections.json
          M	tools/dictionary/test_corpus_integrity.py
          M	tools/dictionary/test_site.py
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff /tmp/expected.txt /tmp/changed.txt

      - name: Check every blob against the independent local build
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          check() {
            actual=$(git hash-object "$2")
            echo "$actual  $2"
            test "$actual" = "$1" || { echo "MISMATCH: expected $1"; exit 1; }
          }
          check e63532a5709a1dcb569ade3d16fe337cb9efb53d dictionary/data/corpus.json
          check 7561b22cff077b6928edd422c947f760d5e9b8d5 dictionary/stories/t039-black-bear-and-pack-basket-bear-grizzly.html
          check f32e4b29641d9b2d467305906108adf4a88e4885 dictionary/stories/t055-the-trickster-person-who-made-the-country.html
          check ee476515aee44f609e69e8a7e67a4ab7831fd875 tools/dictionary/provenance/notebook-collation-corrections.json
          check 88bf1ea02b897e975e43863f74f68b36bb4e02b0 tools/dictionary/test_site.py
          check 22a6b246f5415ab0e1c261991130fef4383ab75b tools/dictionary/test_corpus_integrity.py

      - name: Commit
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -q -F - <<'EOF'
          Corpus: t039 76/77 line division, t055 1308 English, checks 4, 7 and 8 [skip ci]

          t039 76/77. The vocative stranded at the end of line 76 moves down to
          77, where the edition's own English for it already stood. Line 76 is
          then the untranslated cry alone, matching its English, and line 77 is
          byte-identical to line 80 of the same story, which carries the same
          English against the same two vocatives. Notebook 99 p. 37 has the pair
          this way round. This changes the 1990 line division; directed by Troy,
          and the documentary division is kept in documentary_original_fields.

          t055 1308. The English on that line glosses Notebook 98 p. 25, the
          following page - 'five days', 'they gambled with their eyes' - and
          carries the printed typo 'thyes'. Jacobs' gloss for this line's own
          Miluk, on p. 24, is restored. Closes #15 only in part: see below.

          Check 4 repaired. It asserted that every correction's revised_value was
          the field's current value, which holds only while a field carries one
          record. t039 line 76 now carries two - a revert, then a redivision - so
          it checks the last record per field, as test_site.py already did.

          Check 7 added. A line-division repair must not add or drop a word: for
          each repaired pair, the words across the two lines must still be the
          words the documentary record held across the same two lines.

          Check 8 added, and it is the important one. Every corpus line's
          `entries` must be exactly the dictionary entries attested on that line,
          and the reverse. The two are one link set stored twice; they agree on
          all 7,149 lines and nothing checked it. That gap is what would let a
          half-repair through - fixing the corpus side of an entry link while
          dictionary.json goes on pointing at a line that no longer holds the
          word. It is why t055 1220/1221 (#14) and the entries half of #15 are
          not in this commit: both need a dictionary-side correction stage, which
          does not exist yet.

          Refs #18, #15.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BgUQM2Gv4ccJzMCowJ1KMY
          EOF

      - name: Full test suite
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          python3 tools/dictionary/test_site.py
          python3 tools/dictionary/test_corpus_integrity.py
          python3 tools/dictionary/test_repair_desk.py

      - name: Negative tests - each new guardrail must fail on the defect it names
        if: steps.guard.outputs.done == 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, subprocess, sys
          from pathlib import Path
          corpus = Path('dictionary/data/corpus.json')
          backup = corpus.read_bytes()
          good = json.loads(backup.decode('utf-8'))

          def integrity():
              return subprocess.run([sys.executable, 'tools/dictionary/test_corpus_integrity.py'],
                                    capture_output=True, text=True)

          def write(doc):
              corpus.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n',
                                encoding='utf-8')

          try:
              # Check 8: a half-done #14, corpus side moved, dictionary side not.
              broken = copy.deepcopy(good)
              for story in broken['stories']:
                  if story['story_id'].startswith('t055'):
                      for line in story['lines']:
                          if line['line'] == 1220:
                              line['entries'] = ['e0126-dilul']
                          if line['line'] == 1221:
                              line['entries'] = []
              write(broken)
              result = integrity()
              assert result.returncode == 1, 'check 8 did not fail on a half-done link move'
              assert 'but dictionary attests' in result.stdout, 'check 8 did not fire'
              print('negative test OK: check 8 catches a half-done entry-link move')

              # Check 7: a word dropped while redividing.
              broken = copy.deepcopy(good)
              for story in broken['stories']:
                  if story['story_id'].startswith('t039'):
                      for line in story['lines']:
                          if line['line'] == 77:
                              line['miluk'] = line['miluk'].split(' ', 1)[1]
                              line['miluk_ascii'] = line['miluk_ascii'].split(' ', 1)[1]
              write(broken)
              result = integrity()
              assert result.returncode == 1, 'check 7 did not fail on a dropped word'
              assert 'words changed across the pair' in result.stdout, 'check 7 did not fire'
              print('negative test OK: check 7 catches a word dropped in a redivision')

              # Check 6, still live from the previous round.
              broken = copy.deepcopy(good)
              for story in broken['stories']:
                  if story['story_id'].startswith('t039'):
                      for line in story['lines']:
                          if line['line'] == 76:
                              documentary = line['documentary_original_fields']['miluk']
                              line['english'] = documentary
              write(broken)
              result = integrity()
              assert result.returncode == 1, 'check 6 did not fail'
              assert 'english is verbatim the documentary miluk' in result.stdout, 'check 6 did not fire'
              print('negative test OK: check 6 still catches rendered Miluk in the English column')
          finally:
              corpus.write_bytes(backup)
          result = integrity()
          assert result.returncode == 0, 'the corpus was not restored after the negative tests'
          print('corpus restored; integrity passes')
          PY
          git diff --exit-code

      - name: Push
        if: steps.guard.outputs.done == 'false'
        run: git push origin HEAD:corpus-repair-t039-l76-vocable-gloss
