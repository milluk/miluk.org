# One-shot rebuild for the t039 line 76 correction (issue #18).
#
# This workflow exists for one run and is deleted afterwards through the API,
# because an Actions token may not modify workflow files. It is not part of the
# repository's normal build.
#
# It regenerates the corpus rather than receiving it: corpus.json is 2.2 MB and
# cannot move through the API. Every blob it produces is checked against the
# hash of an independent local build from the same inputs, so CI is a transport
# for bytes that were already verified elsewhere, not a source of truth.
name: one-shot-round2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corpus-repair-t039-l76-vocable-gloss
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply the correction
        run: python3 apply_round2.py

      - name: Regenerate the public corpus
        run: |
          set -euo pipefail
          T=tools/dictionary
          PYTHONDONTWRITEBYTECODE=1 python3 $T/pipeline/publish_corpus.py \
            --working-corpus $T/archive/restoration-checkpoint/corpus-v2-working.json \
            --classification $T/provenance/source-classification.json \
            --v2-receipt $T/provenance/v2-effective-diff.json \
            --notebook-collation $T/provenance/notebook-collation-corrections.json \
            --public-output dictionary/data/corpus.json \
            --outside-output $T/archive/outside-edition/slip-file-records.json \
            --containers-output $T/archive/outside-edition/working-containers.json

      - name: Pin the new corpus hash
        run: |
          set -euo pipefail
          SHA=$(python3 -c "import hashlib;print(hashlib.sha256(open('dictionary/data/corpus.json','rb').read()).hexdigest())")
          echo "corpus sha256: $SHA"
          test "$SHA" = "2f7e96984f310cbca603862260a7fd2a954c883f8de621c3d2a3dfc92675988e"
          python3 - "$SHA" <<'PY'
          import sys
          from pathlib import Path
          p = Path('tools/dictionary/test_site.py')
          t = p.read_text(encoding='utf-8')
          assert t.count('CORPUS_SHA_PLACEHOLDER') == 1, 'placeholder not found exactly once'
          p.write_text(t.replace('CORPUS_SHA_PLACEHOLDER', sys.argv[1]), encoding='utf-8')
          PY

      - name: Regenerate the site
        run: python3 tools/dictionary/gen.py

      - name: Remove the applier
        run: rm -f apply_round2.py

      - name: Assert the changed-file set is exactly what was expected
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-status | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          D	apply_round2.py
          M	dictionary/data/corpus.json
          M	dictionary/stories/t039-black-bear-and-pack-basket-bear-grizzly.html
          M	tools/dictionary/provenance/notebook-collation-corrections.json
          M	tools/dictionary/test_corpus_integrity.py
          M	tools/dictionary/test_site.py
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff /tmp/expected.txt /tmp/changed.txt

      - name: Check every blob against the independent local build
        run: |
          set -euo pipefail
          check() {
            actual=$(git hash-object "$2")
            echo "$actual  $2"
            test "$actual" = "$1" || { echo "MISMATCH: expected $1"; exit 1; }
          }
          check 0ef6bdbe050dad658d088479f1b404cd825f5c6e dictionary/data/corpus.json
          check 0b2513fe1993dc29268dbcfe4d749f4a3b25513d dictionary/stories/t039-black-bear-and-pack-basket-bear-grizzly.html
          check ec30000a00e0bb40199c8b0e12036747ff42d94d tools/dictionary/provenance/notebook-collation-corrections.json
          check 11496c89b0f4aa7fb9d23ea6d728d0b59a873745 tools/dictionary/test_site.py
          check e668cb58599ce32cf4daf463e2be17c02d995779 tools/dictionary/test_corpus_integrity.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -q -F - <<'EOF'
          Corpus: t039 line 76 - restore the transcription, render the untranslated cry [skip ci]

          The third line the v2 field-orientation repair mishandled, and the only
          one whose documentary record was itself wrong: its English field held a
          degraded ASCII duplicate of the cry rather than English, so the repair
          had nothing correct to swap towards and rotated the good transcription
          out of miluk_ascii. The vocative t#@-'n@hi:<me, survived in no visible
          field.

          - miluk_ascii and miluk revert to the documentary values, recovering the
            vocative. Notebook 99 p. 37 carries the full reading.
          - english takes an editorial rendering of the vocables in English
            orthography, unit for unit against the transcription. There is no
            English gloss for this line in any source; Jacobs began glossing one
            word later, at the vocative, which the edition puts on line 77.

          New guardrail: no line's visible english may be identical to the Miluk
          in its own documentary_original_fields. Checks 1 and 2 both pass on this
          defect, since what landed in the English field was rendered Miluk and
          carried none of the transcription marks check 2 looks for. Against the
          corpus before this correction the new rule fires on line 76 and nothing
          else.

          A rule "no Miluk field may contain U+002F" was drafted and withdrawn; it
          fails on eight lines of t003 and t004 where the slash is ordinary Jacobs
          notation inside a word. Recorded in the test so it is not re-proposed.

          Also restores the superseded corpus pin that was dropped from
          test_site.py's comment when PR #17 rebuilt that file through CI.

          Closes #18.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BgUQM2Gv4ccJzMCowJ1KMY
          EOF

      - name: Full test suite
        run: |
          set -euo pipefail
          python3 tools/dictionary/test_site.py
          python3 tools/dictionary/test_corpus_integrity.py
          python3 tools/dictionary/test_repair_desk.py

      - name: Negative test - the guardrails fail without the correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          T = Path('tools/dictionary')
          live = T / 'provenance' / 'notebook-collation-corrections.json'
          corpus = Path('dictionary/data/corpus.json')
          backup, corpus_backup = live.read_bytes(), corpus.read_bytes()
          try:
              d = json.loads(backup.decode('utf-8'))
              d['corrections'] = [i for i in d['corrections']
                                  if not (i['target']['line'] == 76
                                          and i['target']['story_id'].startswith('t039'))]
              d['summary']['records'] = len(d['corrections'])
              live.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              subprocess.run([sys.executable, str(T / 'pipeline' / 'publish_corpus.py'),
                  '--working-corpus', str(T / 'archive' / 'restoration-checkpoint' / 'corpus-v2-working.json'),
                  '--classification', str(T / 'provenance' / 'source-classification.json'),
                  '--v2-receipt', str(T / 'provenance' / 'v2-effective-diff.json'),
                  '--notebook-collation', str(live),
                  '--public-output', str(corpus),
                  '--outside-output', str(T / 'archive' / 'outside-edition' / 'slip-file-records.json'),
                  '--containers-output', str(T / 'archive' / 'outside-edition' / 'working-containers.json')],
                  check=True, capture_output=True)
              r = subprocess.run([sys.executable, str(T / 'test_corpus_integrity.py')],
                                 capture_output=True, text=True)
              print(r.stdout)
              assert r.returncode == 1, 'integrity test passed on the uncorrected corpus'
              assert 'english is verbatim the documentary miluk' in r.stdout, \
                  'guardrail 6 did not fire on the uncorrected corpus'
              print('negative test OK: guardrail 6 fires without the correction')
          finally:
              live.write_bytes(backup)
              corpus.write_bytes(corpus_backup)
          PY
          git diff --exit-code

      - name: Push
        run: git push origin HEAD:corpus-repair-t039-l76-vocable-gloss
