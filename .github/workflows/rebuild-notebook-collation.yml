name: Rebuild corpus from the notebook-collation stage

# One-shot job for the corpus-repair-notebook-collation branch.
#
# Why it exists: three of the eleven files in this change are regenerated
# artefacts (corpus.json at 2.2 MB and three story/word pages), far too large to
# push through the API one file at a time. They do not need pushing. The four
# source files fully determine them, so CI rebuilds them here and proves it.
#
# test_site.py is rebuilt rather than pushed for a different reason: it contains
# nine lines with literal ̯ escape sequences in the Python source, and those
# do not survive being retyped through a tool call. So the pristine file is taken
# from the base branch and thirteen ASCII-only edits are applied to it, with the
# result pinned to a SHA-256 computed locally. Byte-exact by construction rather
# than by trust.
#
# Delete this workflow once it has run.

on:
  push:
    branches: [corpus-repair-notebook-collation]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: corpus-repair-notebook-collation

      - name: Rebuild test_site.py from the pristine base-branch file
        run: |
          set -euo pipefail
          git show origin/dictionary-1990-reproducibility-repair:tools/dictionary/test_site.py \
            > tools/dictionary/test_site.py
          python3 - <<'PY'
          import hashlib, json, sys
          EXPECTED = 'f43a994ab58eebc09ff1e7725257a4facd15ff7d7c6241020e5d7c3ac4c8a90f'
          path = 'tools/dictionary/test_site.py'
          text = open(path, encoding='utf-8').read()
          edits = json.load(open('tools/dictionary/.transit-test-site-edits.json', encoding='utf-8'))
          for n, edit in enumerate(edits, 1):
              if text.count(edit['find']) != 1:
                  sys.exit('edit %d does not match exactly once' % n)
              text = text.replace(edit['find'], edit['replace'], 1)
          digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
          if digest != EXPECTED:
              sys.exit('rebuilt test_site.py is %s, expected %s' % (digest, EXPECTED))
          open(path, 'w', encoding='utf-8').write(text)
          print('test_site.py rebuilt and pinned:', digest)
          PY
          rm tools/dictionary/.transit-test-site-edits.json

      - name: Regenerate the corpus with the notebook-collation stage
        run: |
          set -euo pipefail
          python3 tools/dictionary/pipeline/publish_corpus.py \
            --working-corpus tools/dictionary/archive/restoration-checkpoint/corpus-v2-working.json \
            --classification tools/dictionary/provenance/source-classification.json \
            --v2-receipt tools/dictionary/provenance/v2-effective-diff.json \
            --notebook-collation tools/dictionary/provenance/notebook-collation-corrections.json \
            --public-output dictionary/data/corpus.json \
            --outside-output tools/dictionary/archive/outside-edition/slip-file-records.json \
            --containers-output tools/dictionary/archive/outside-edition/working-containers.json

      - name: Regenerate the site
        run: python3 tools/dictionary/gen.py

      - name: Refuse anything the change is not supposed to touch
        run: |
          set -euo pipefail
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add -A -- . ':!.github/workflows'
          git diff --cached --name-only origin/dictionary-1990-reproducibility-repair \
            | sort > /tmp/actual
          cat > /tmp/expected <<'FILES'
          dictionary/data/corpus.json
          dictionary/stories/t039-black-bear-and-pack-basket-bear-grizzly.html
          dictionary/stories/t055-the-trickster-person-who-made-the-country.html
          dictionary/words/e0116-deu.html
          dictionary/words/e0376-hithidiyu.html
          dictionary/words/e0469-idje-.html
          dictionary/words/e0861-t-ccil.html
          tools/dictionary/pipeline/publish_corpus.py
          tools/dictionary/provenance/notebook-collation-corrections.json
          tools/dictionary/test_corpus_integrity.py
          tools/dictionary/test_site.py
          FILES
          sort -o /tmp/expected /tmp/expected
          grep -v '^\.github/workflows/' /tmp/actual > /tmp/actual.filtered || true
          diff -u /tmp/expected /tmp/actual.filtered
          echo 'changed file set is exactly the eleven expected'

      - name: Commit, then verify, then push
        run: |
          set -euo pipefail
          git commit -q -m "Corpus: 2026 notebook collation - rebuild data and site [skip ci]

          Regenerated by CI from the four source files on this branch, which fully
          determine this output. test_site.py was rebuilt from the base-branch file
          plus thirteen ASCII-only edits and pinned to a SHA-256 computed locally,
          because its nine literal \\u032f escape sequences cannot survive being
          retyped through a tool call.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          python3 tools/dictionary/test_site.py
          python3 tools/dictionary/test_repair_desk.py
          python3 tools/dictionary/test_corpus_integrity.py
          git push origin HEAD:corpus-repair-notebook-collation
